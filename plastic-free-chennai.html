@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');
* { box-sizing: border-box; margin: 0; }
.pfc {
  min-height: 100vh; background: #0A1628; color: #E2E8F0;
  font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  background-image: radial-gradient(ellipse 900px 500px at 70% -10%, rgba(45,212,191,0.14), transparent 60%),
    radial-gradient(ellipse 700px 400px at 0% 30%, rgba(56,116,203,0.10), transparent 60%);
}
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 20px 60px; }
.tile {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.11);
  border-radius: 18px; padding: 22px; transition: transform .2s ease, border-color .2s ease, background .2s ease;
}
.tile.hov:hover { transform: translateY(-3px); border-color: rgba(94,234,212,0.45); background: rgba(255,255,255,0.075); cursor: pointer; }
.tile.teal { background: rgba(45,212,191,0.08); border-color: rgba(94,234,212,0.28); }
.grid { display: grid; gap: 12px; }
.btn {
  display: inline-block; background: #2DD4BF; color: #042F2E; border: none; font: inherit;
  font-weight: 700; font-size: 15px; padding: 11px 22px; border-radius: 12px; cursor: pointer;
  transition: transform .15s ease, filter .15s ease;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
.btn.ghost { background: rgba(255,255,255,0.06); color: #E2E8F0; border: 1px solid rgba(255,255,255,0.16); font-weight: 500; }
.btn.sm { padding: 7px 14px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.chip { display: inline-block; font-size: 12px; color: #5EEAD4; border: 1px solid rgba(94,234,212,0.4); background: rgba(45,212,191,0.08); padding: 4px 12px; border-radius: 999px; }
.eyebrow { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #5EEAD4; margin-bottom: 10px; }
h1 { font-size: clamp(30px, 5.5vw, 52px); line-height: 1.12; color: #F8FAFC; font-weight: 700; letter-spacing: -1px; }
h2 { font-size: clamp(22px, 3.5vw, 32px); color: #F8FAFC; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
h3 { font-size: 18px; color: #F1F5F9; font-weight: 500; }
.muted { color: #94A3B8; font-size: 15px; line-height: 1.65; }
.small { font-size: 13px; color: #94A3B8; line-height: 1.55; }
.big { font-size: clamp(26px, 4vw, 40px); font-weight: 700; color: #5EEAD4; letter-spacing: -1px; }
.nav {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  padding: 18px 0; position: relative; z-index: 5;
}
.navlinks { display: flex; flex-wrap: wrap; gap: 4px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.11); border-radius: 999px; padding: 5px; }
.navlink { font: inherit; font-size: 13.5px; color: #CBD5E1; background: none; border: none; padding: 7px 13px; border-radius: 999px; cursor: pointer; transition: all .15s; }
.navlink:hover { color: #F8FAFC; background: rgba(255,255,255,0.07); }
.navlink.on { background: #2DD4BF; color: #042F2E; font-weight: 700; }
.dd { position: absolute; top: calc(100% + 8px); right: 0; min-width: 250px; background: #0F2233; border: 1px solid rgba(94,234,212,0.3); border-radius: 14px; padding: 8px; z-index: 50; box-shadow: 0 18px 50px rgba(0,0,0,0.5); }
.dditem { display: block; width: 100%; text-align: left; font: inherit; font-size: 14px; color: #E2E8F0; background: none; border: none; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.dditem:hover { background: rgba(45,212,191,0.12); color: #5EEAD4; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.gamecard { position: relative; overflow: hidden; }
.opt { display: block; width: 100%; text-align: left; font: inherit; font-size: 15px; color: #E2E8F0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.13); border-radius: 12px; padding: 13px 16px; margin-top: 10px; cursor: pointer; transition: all .15s; }
.opt:hover { border-color: rgba(94,234,212,0.5); background: rgba(45,212,191,0.07); }
.opt.right { background: rgba(52,211,153,0.16); border-color: #34D399; color: #A7F3D0; }
.opt.wrong { background: rgba(244,63,94,0.13); border-color: #FB7185; color: #FDA4AF; }
.binbtn { flex: 1; font: inherit; font-weight: 700; font-size: 15px; padding: 16px 8px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #E2E8F0; cursor: pointer; transition: all .12s; }
.binbtn:hover { border-color: rgba(94,234,212,0.55); transform: translateY(-2px); }
input[type=range] { width: 100%; accent-color: #2DD4BF; }
.pfc input[type=text], .pfc select {
  font: inherit; font-size: 15px; color: #F1F5F9; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 11px 14px; width: 100%;
}
.pfc input:focus, .pfc select:focus { outline: 2px solid rgba(45,212,191,0.5); }
.pfc select option { background: #0F2233; }
.swapline { display: flex; align-items: center; gap: 12px; padding: 13px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap; }
.foot { border-top: 1px solid rgba(255,255,255,0.09); margin-top: 50px; padding-top: 22px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.bounce { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(.7); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
.floaty { animation: floaty 5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .floaty, .bounce { animation: none; } .tile, .btn { transition: none; } }
@media (max-width: 700px) {
  .grid { grid-template-columns: 1fr !important; }
  .span2 { grid-column: span 1 !important; }
  .herotile { grid-row: auto !important; }
}
